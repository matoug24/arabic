{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><div class="eyebrow">SEPARATE ACCOUNTS, SEPARATE JOURNEYS</div><h1>Your children</h1><p>Each child has their own practice, assignments and quizzes. Reset a password here whenever needed.</p></div></div><div class="children-grid"><section class="panel"><h2>Add a child</h2><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Name<input name="name" required></label><label>Username<input name="username" required autocomplete="off"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><button class="primary">Create account</button></form></section>{% for c in children %}<section class="panel"><h2>{{ c.name }}</h2><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="id" value="{{ c.id }}"><label>Name<input name="name" value="{{ c.name }}" required></label><label>Username<input name="username" value="{{ c.username }}" required></label><label>New password (leave blank to keep)<input name="password" type="password" autocomplete="new-password" minlength="8"></label><label class="toggle"><input type="checkbox" name="enabled" {% if c.enabled %}checked{% endif %}>Account enabled</label><label class="toggle"><input type="checkbox" name="review_only" {% if c.review_only %}checked{% endif %}>Review-only pacing (pause new assignments)</label><button class="primary">Save child</button></form></section>{% endfor %}</div>{% endblock %}
