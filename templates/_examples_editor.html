{% for example in examples %}
<div class="example-editor">
  <audio controls preload="none" aria-label="{{ example.label or 'Example ' ~ loop.index }}" src="{{ url_for('example_media',eid=example.id) }}"></audio>
  <form method="post" action="{{ url_for('edit_example',wid=w.id,eid=example.id) }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit" class="link-button" name="action" value="delete">Remove example</button>
  </form>
</div>
{% endfor %}
<div class="example-editor recorder" data-upload="{{ url_for('edit_example',wid=w.id) }}" data-example="true" data-compact="true">
  <div class="record-buttons"><button type="button" class="secondary record-start">Record example</button><button type="button" class="secondary record-stop" hidden disabled>Stop</button></div>
  <p class="record-status" role="status" hidden></p>
  <audio class="record-preview" controls hidden></audio>
  <button type="button" class="primary record-save" hidden>Save example</button>
</div>
